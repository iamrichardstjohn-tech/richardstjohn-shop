name: Independent preservation archive
on:
  push:
    branches:
      - backup/preservation-2026-11-18
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive source and git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          git archive --format=zip --output=backup/source.zip HEAD
          git bundle create backup/history.bundle --all
          sha256sum backup/* > backup/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: independent-preservation
          path: backup/
          retention-days: 30
          if-no-files-found: error
